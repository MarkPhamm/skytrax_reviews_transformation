version: 2

exposures:
  - name: spirit_airlines_dashboard
    label: Spirit Airlines Review Dashboard
    type: dashboard
    maturity: medium
    # Mode workspaces are private — point at the dashboard repo (PDF + SQL).
    # Swap for the live Mode report URL when the workspace link is shareable.
    url: https://github.com/MiaTran1112/spirit_airlines_dashboard
    description: >
      Mode Analytics dashboard analyzing Spirit Airlines customer satisfaction
      (~4,671 reviews, 2015–2025): average review rating, recommendation rate,
      rating bands, and breakdowns by service, seat type, traveller type,
      aircraft, airport, and year. Queries live in the spirit_airlines_dashboard
      repo (sql/) and run against MARTS.FCT_REVIEW_ENRICHED. PDF export is in
      that repo under dashboard/.
    depends_on:
      - ref('fct_review_enriched')
      - ref('dim_aircraft')
      - ref('dim_location')
    owner:
      name: Mark Pham
      email: minh.pham@insurify.com

version: 2

models:
  - name: fct_review
    description: |
      Review fact table combining all review metrics with enrichments.
      Includes calculated average ratings and categorical rating bands.
      All foreign keys reference conformed dimensions.
      Grain: one row per review submission.
      Materialized incrementally (merge on review_key) using the source
      updated_at high-water mark with a configurable lookback window.
    columns:
      - name: review_key
        data_type: varchar
        description: Surrogate key for the review fact (deterministic, idempotent).
        tests:
          - unique
          - not_null
        config:
          meta:
            datatypes: string

      - name: review_id
        data_type: varchar
        description: Review identifier — deterministic hash of the review natural key, assigned in staging.
        tests:
          - not_null
        config:
          meta:
            datatypes: string

      - name: customer_id
        data_type: varchar
        description: Foreign key to dim_customer.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
        config:
          meta:
            datatypes: string

      - name: airline_id
        data_type: varchar
        description: Foreign key to dim_airline.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airline')
                field: airline_id
        config:
          meta:
            datatypes: string

      - name: date_submitted_id
        data_type: date
        description: Foreign key to dim_date (submission date).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
        config:
          meta:
            datatypes: date

      - name: date_flown_id
        data_type: date
        description: Foreign key to dim_date (flight date).
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
        config:
          meta:
            datatypes: date

      - name: origin_location_id
        data_type: varchar
        description: Foreign key to dim_location (origin).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
        config:
          meta:
            datatypes: string

      - name: destination_location_id
        data_type: varchar
        description: Foreign key to dim_location (destination).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
        config:
          meta:
            datatypes: string

      - name: transit_location_id
        data_type: varchar
        description: Foreign key to dim_location (transit stop).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
        config:
          meta:
            datatypes: string

      - name: aircraft_id
        data_type: varchar
        description: Foreign key to dim_aircraft.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_aircraft')
                field: aircraft_id
        config:
          meta:
            datatypes: string

      - name: is_verified
        data_type: boolean
        description: Whether the review was verified by the airline.
        tests:
          - accepted_values:
              arguments:
                values: [true, false, null]
        config:
          meta:
            datatypes: boolean

      - name: seat_type
        data_type: varchar
        description: Type of seat purchased (Premium Economy, Business Class, Economy Class, First Class).
        tests:
          - accepted_values:
              arguments:
                values: ['Premium Economy', 'Business Class', 'Economy Class', 'First Class', null]
        config:
          meta:
            datatypes: string

      - name: type_of_traveller
        data_type: varchar
        description: Category of traveller (Business, Couple Leisure, Family Leisure, Solo Leisure).
        tests:
          - accepted_values:
              arguments:
                values: ['Business', 'Couple Leisure', 'Family Leisure', 'Solo Leisure', null]
        config:
          meta:
            datatypes: string

      - name: has_layover
        data_type: boolean
        description: Whether the flight included a transit stop.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
        config:
          meta:
            datatypes: boolean

      - name: seat_comfort
        data_type: number(38,0)
        description: Seat comfort rating (1-5 scale, null allowed).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
              row_condition: "seat_comfort is not null"
        config:
          meta:
            datatypes: integer

      - name: cabin_staff_service
        data_type: number(38,0)
        description: Cabin staff service rating (1-5 scale, null allowed).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
              row_condition: "cabin_staff_service is not null"
        config:
          meta:
            datatypes: integer

      - name: food_and_beverages
        data_type: number(38,0)
        description: Food and beverages rating (1-5 scale, null allowed).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
              row_condition: "food_and_beverages is not null"
        config:
          meta:
            datatypes: integer

      - name: inflight_entertainment
        data_type: number(38,0)
        description: Inflight entertainment rating (1-5 scale, null allowed).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
              row_condition: "inflight_entertainment is not null"
        config:
          meta:
            datatypes: integer

      - name: ground_service
        data_type: number(38,0)
        description: Ground service rating (1-5 scale, null allowed).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
              row_condition: "ground_service is not null"
        config:
          meta:
            datatypes: integer

      - name: wifi_and_connectivity
        data_type: number(38,0)
        description: WiFi and connectivity rating (1-5 scale, null allowed).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
              row_condition: "wifi_and_connectivity is not null"
        config:
          meta:
            datatypes: integer

      - name: value_for_money
        data_type: number(38,0)
        description: Value for money rating (1-5 scale, null allowed).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
              row_condition: "value_for_money is not null"
        config:
          meta:
            datatypes: integer

      - name: recommended
        data_type: boolean
        description: Whether the reviewer recommends the airline.
        tests:
          - accepted_values:
              arguments:
                values: [true, false, null]
        config:
          meta:
            datatypes: boolean

      - name: average_rating
        data_type: number(38,2)
        description: |
          Calculated average rating across all seven sub-ratings.
          Computed using only non-null sub-ratings. Range 0–5; null if all sub-ratings null.
          Rounded to 2 decimal places.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 5
              row_condition: "average_rating is not null"
        config:
          meta:
            datatypes: numeric

      - name: rating_band
        data_type: varchar
        description: |
          Categorical band derived from average_rating.
          Bands: 'bad' (0–<2), 'medium' (2–<4), 'good' (4–5), 'unknown' (null).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bad', 'medium', 'good', 'unknown']
        config:
          meta:
            datatypes: string

      - name: review_text
        data_type: varchar
        description: Full text of the review comment.
        config:
          meta:
            datatypes: string

      - name: source_updated_at
        data_type: timestamp_ntz
        description: Timestamp when the record was last updated in the source system.
        tests:
          - not_null
        config:
          meta:
            datatypes: timestamp

      - name: dbt_loaded_at
        data_type: timestamp_ltz
        description: Timestamp when the record was loaded by dbt.
        tests:
          - not_null
        config:
          meta:
            datatypes: timestamp

    config:
      contract:
        enforced: true
      elementary:
        timestamp_column: source_updated_at

    # Elementary volume anomaly: warn if daily row counts on source_updated_at
    # drift vs recent history. Requires `dbt run -s elementary` once so the
    # edr schema tables exist. See docs/observability.md.
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: source_updated_at
            time_bucket:
              period: day
              count: 1
          config:
            severity: warn
            tags: ['elementary']

# ---

  - name: dim_location
    description: |
      Location dimension table combining origin, destination, and transit airports.
      Grain: one row per unique (city, airport) combination.
    columns:
      - name: location_id
        data_type: varchar
        description: Surrogate key for location (deterministic, idempotent).
        tests:
          - unique
          - not_null

      - name: city
        data_type: varchar
        description: City name (e.g., New York, London).
        tests:
          - not_null

      - name: airport
        data_type: varchar
        description: Airport code (e.g., JFK, LHR).
        tests:
          - not_null

    config:
      contract:
        enforced: true

# ---

  - name: dim_date
    description: |
      Date dimension table spanning from 2015-01-01.
      Includes calendar and financial period attributes.
      Grain: one row per calendar date.
    columns:
      - name: date_id
        data_type: date
        description: Surrogate key representing each calendar date.
        tests:
          - unique
          - not_null

      - name: day_of_week
        data_type: number
        description: Numeric day of the week (1=Monday).

      - name: day_of_week_name
        data_type: varchar
        description: Full name of the day of the week (Monday, Tuesday, etc.).

      - name: cal_week_start_date
        data_type: date
        description: Start date of the calendar week (usually Monday).

      - name: day_of_month
        data_type: number
        description: Day of the month (1-31).

      - name: cal_month
        data_type: number
        description: Calendar month as integer (1-12).

      - name: cal_mon_name
        data_type: varchar
        description: Full name of the calendar month (January, February, etc.).

      - name: cal_mon_name_short
        data_type: varchar
        description: Abbreviated month name (Jan, Feb, etc.).

      - name: cal_quarter
        data_type: number
        description: Calendar quarter number (1-4).

      - name: cal_quarter_name
        data_type: varchar
        description: Quarter name (Q1, Q2, Q3, Q4).

      - name: cal_year
        data_type: number
        description: Calendar year (4-digit).

      - name: is_weekend
        data_type: boolean
        description: Boolean flag for weekend days (Saturday, Sunday).
        tests:
          - accepted_values:
              arguments:
                values: [true, false]

      - name: fin_year
        data_type: number
        description: Financial year (fiscal year starting July 1).

      - name: fin_period
        data_type: number
        description: Financial period number within fiscal year.

      - name: fin_quarter
        data_type: number
        description: Financial quarter number within fiscal year.

      - name: fin_week
        data_type: number
        description: Financial week number within fiscal year.

      - name: fin_period_name
        data_type: varchar
        description: Financial period name (e.g., p1, p2, ..., p12).

      - name: fin_quarter_name
        data_type: varchar
        description: Financial quarter name (e.g., FQ1, FQ2, FQ3, FQ4).

      - name: fin_week_name
        data_type: varchar
        description: Financial week name (e.g., wk1, wk2, ..., wk52).

    config:
      contract:
        enforced: true
      tags:
        - one_time_run

# ---

  - name: dim_aircraft
    description: |
      Aircraft dimension table with manufacturer and capacity attributes.
      Grain: one row per unique aircraft model.
    columns:
      - name: aircraft_id
        data_type: varchar
        description: Surrogate key for aircraft (deterministic, idempotent).
        tests:
          - unique
          - not_null

      - name: aircraft_model
        data_type: varchar
        description: Aircraft model name (e.g., Boeing 777, Airbus A380).
        tests:
          - not_null

      - name: aircraft_manufacturer
        data_type: varchar
        description: Aircraft manufacturer (Airbus, Boeing, Embraer, Saab, Unknown).

      - name: seat_capacity
        data_type: number
        description: Maximum seating capacity of the aircraft.

    config:
      contract:
        enforced: true

# ---

  - name: dim_customer
    description: |
      Customer dimension table aggregating reviews by customer identity.
      Grain: one row per unique (customer_name, nationality) combination.
      Includes denormalized review count.
    columns:
      - name: customer_id
        data_type: varchar
        description: Surrogate key for customer (deterministic, idempotent).
        tests:
          - unique
          - not_null

      - name: customer_name
        data_type: varchar
        description: Name of the customer. 'Unknown' for missing values.
        tests:
          - not_null

      - name: nationality
        data_type: varchar
        description: Nationality of the customer. 'Unknown' for missing values.
        tests:
          - not_null

      - name: number_of_flights
        data_type: number
        description: Count of reviews (flights) associated with this customer.

    config:
      contract:
        enforced: true

# ---

  - name: dim_airline
    description: |
      Airline dimension table.
      Grain: one row per unique airline.
    columns:
      - name: airline_id
        data_type: varchar
        description: Surrogate key for airline (deterministic, idempotent).
        tests:
          - unique
          - not_null

      - name: airline_name
        data_type: varchar
        description: Name of the airline.
        tests:
          - not_null

      # The model emits this column; an enforced contract requires every
      # output column to be declared here.
      - name: airline_name_cleaned
        data_type: varchar
        description: Lowercased, trimmed airline name for joining/matching.

    config:
      contract:
        enforced: true

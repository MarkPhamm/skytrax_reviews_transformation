# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'skytrax_transformation'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'skytrax_transformation'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
# directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  skytrax_transformation:
    # Config indicated by + and applies to all files under models/example/
    staging:
      +materialized: view
      +schema: SOURCE
      +enabled: true
      +tags: ['staging']
    intermediate:
      +materialized: view
      +schema: INTERMEDIATE
      +enabled: true
      +tags: ['intermediate']
    marts:
      +materialized: table
      +schema: MARTS
      +enabled: true
      +tags: ['marts']
      aggregated:
        +tags: ['aggregated']

  # Elementary observability models (artifacts, test results, anomaly scores).
  # Package registers on-run-start / on-run-end hooks. See docs/observability.md.
  elementary:
    +schema: elementary

seeds:
  skytrax_transformation:
    review:
      +enabled: true
      +tags: ['seeds']
      +schema: RAW

# Persist the failing rows of every data test so failures can be inspected
# with SQL instead of re-running the test. With our generate_schema_name
# macro the audit tables land in DBT_TEST__AUDIT on prod (custom schema
# names pass through verbatim) and in the working schema on dev/CI targets.
data_tests:
  skytrax_transformation:
    +store_failures: true

flags:
  require_generic_test_arguments_property: true
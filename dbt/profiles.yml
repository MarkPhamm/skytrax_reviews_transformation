skytrax_transformation:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: SKYTRAX_REVIEWS_DB
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 10
      warehouse: SKYTRAX_COMPUTE_XSMALL
      client_session_keep_alive: False

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      # Key-pair auth (planned cutover -- see docs/keypair-auth.md):
      # replace `password:` with the two lines below once the PROD_DBT
      # public key is provisioned via Terraform.
      # private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      # private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: SKYTRAX_REVIEWS_DB
      schema: SOURCE
      threads: 10
      warehouse: SKYTRAX_COMPUTE_MEDIUM
      client_session_keep_alive: False
      query_tag: github_action_deploy

    staging:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      # Key-pair auth (planned cutover -- see docs/keypair-auth.md):
      # replace `password:` with the two lines below once the DBT_CICD
      # public key is provisioned via Terraform.
      # private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      # private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: SKYTRAX_REVIEWS_DB
      schema: STAGING
      threads: 10
      warehouse: SKYTRAX_COMPUTE_SMALL
      client_session_keep_alive: False
      query_tag: github_action_ci
